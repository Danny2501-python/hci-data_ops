name: Deploy DAGs to NFS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Deploy DAGs
        run: |
          echo "🚀 Deploying DAGs to NFS..."
          # Sync dags, delete file thừa, nhưng GIỮ LẠI __pycache__
          rsync -av --delete --exclude='__pycache__' --exclude='*.pyc' dags/ /mnt/nfs_share/airflow/dags/
          echo "✅ DAGs deployed successfully!"

      - name: Deploy App
        run: |
          echo "🚀 Deploying App..."
          # Deploy App: Xóa sạch cũ, ghi mới hoàn toàn
          rm -rf /mnt/nfs_share/app
          mkdir -p /mnt/nfs_share/app
          cp -r app/* /mnt/nfs_share/app/
          echo "✅ App deployed successfully!"