name: Deploy DAGs to NFS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Deploy DAGs
        run: |
          echo "🚀 Deploying DAGs to NFS..."
          # Sync dags, delete file thừa, nhưng GIỮ LẠI __pycache__
          rsync -av --delete --exclude='__pycache__' --exclude='*.pyc' dags/ /mnt/nfs_share/airflow/dags/
          # Fix quyền cho Airflow đọc được
          chown -R 50000:0 /mnt/nfs_share/airflow/dags
          chmod -R 755 /mnt/nfs_share/airflow/dags
          echo "✅ DAGs deployed successfully!"

      - name: Deploy App
        run: |
          echo "🚀 Deploying App..."
          rsync -av --delete --exclude='__pycache__' --exclude='*.pyc' app/ /mnt/nfs_share/app/
          echo "✅ App deployed successfully!"